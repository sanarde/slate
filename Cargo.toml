# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "slate"
version = "0.1.0"
edition = "2024"
description = "Window manager of SanarDE for Wayland and X11"
license = "GPL-3.0-only"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    "xwayland",
] }
fontdue = "0.9"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
rustix = { version = "1", features = ["event", "time"] }
x11rb = { version = "0.13", features = ["randr", "shape"] }
xcursor = "0.3"
