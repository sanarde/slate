# Material Design 3. The colors are roles of the Seurat color scheme, so they follow
# the wallpaper. Without Seurat the built in baseline palette is used.
#
# The titlebar is the top app bar of the window: the same surface as the window, with
# no bar and no border between them, a small medium title on the left and standard
# icon buttons that only show a state layer, 8 percent on hover and 10 percent when
# pressed. A focused window is told apart by its shadow, elevation level 3 against
# level 1, and by the title color. Corners are extra-large (28), sizes follow the
# 8dp grid. Motion uses the emphasized curves, windows decelerate in and accelerate out.

titlebar-color-focused = @surface
title-color-focused = @on_surface
titlebar-color-unfocused = @surface
title-color-unfocused = @on_surface_variant
border-color-focused = @surface
border-color-unfocused = @surface
button-icon-color-focused = @on_surface_variant
button-icon-color-unfocused = @outline
button-hover-color = @on_surface/8
button-pressed-color = @on_surface/10
button-close-hover-color = @error_container

title-font = Roboto Flex:medium
title-font-size = 13
title-align = left
title-padding = 16
titlebar-height = 40
border-width = 0
corner-radius = 28
button-shape = circle
button-size = 28
button-spacing = 4
button-margin = 12

elevation-focused = 3
elevation-unfocused = 1

animation-duration = 400
animation-curve = emphasized-decelerate
animation-close-duration = 200
animation-close-curve = emphasized-accelerate
animation-open-scale = 90
