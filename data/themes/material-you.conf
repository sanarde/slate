# Material Design 3. The colors are roles of the Seurat color scheme, so they follow
# the wallpaper. Without Seurat the built in baseline palette is used.
#
# The titlebar is a small top app bar: a flat surface when the window is not
# focused and the elevated surface container when it is, title medium text on the
# left and standard icon buttons of 40 with state layers of 8 percent on hover and
# 10 percent when pressed. Depth comes from the tone first, the shadow is the one of
# elevation level 3 for the focused window and level 1 for the others. Corners are
# large-increased (20), the spacing follows the 8dp grid. Motion uses the emphasized
# curves, windows decelerate in and accelerate out.

titlebar-color-focused = @surface_container
title-color-focused = @on_surface
titlebar-color-unfocused = @surface
title-color-unfocused = @on_surface_variant
border-color-focused = @outline_variant
border-color-unfocused = @outline_variant
button-icon-color-focused = @on_surface_variant
button-icon-color-unfocused = @outline
button-hover-color = @on_surface/8
button-pressed-color = @on_surface/10
button-close-hover-color = @error_container

title-font = Roboto Flex:medium
title-font-size = 14
title-align = left
title-padding = 16
titlebar-height = 48
border-width = 1
corner-radius = 20
button-shape = circle
button-size = 40
button-spacing = 4
button-margin = 4

elevation-focused = 3
elevation-unfocused = 1

animation-duration = 400
animation-curve = emphasized-decelerate
animation-close-duration = 200
animation-close-curve = emphasized-accelerate
animation-open-scale = 90
