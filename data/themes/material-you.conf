# Material Design 3. The colors are roles of the Seurat color scheme, so they follow
# the wallpaper. Without Seurat the built in baseline palette is used.
#
# Surfaces use the tonal surface containers, the focused window is raised to
# elevation 3 and the others to elevation 1. Buttons are circular icon buttons with
# state layers of 8 percent on hover and 12 percent when pressed. Motion uses the
# emphasized curves, windows decelerate in and accelerate out.

titlebar-color-focused = @surface_container_high
title-color-focused = @on_surface
titlebar-color-unfocused = @surface_container
title-color-unfocused = @on_surface_variant
border-color-focused = @outline_variant
border-color-unfocused = @outline_variant
button-icon-color-focused = @on_surface_variant
button-icon-color-unfocused = @outline
button-hover-color = @on_surface/8
button-pressed-color = @on_surface/12
button-close-hover-color = @error_container

title-font = Roboto Flex, sans-serif
title-font-size = 14
title-align = center
titlebar-height = 40
border-width = 1
corner-radius = 16
button-shape = circle
button-size = 28
button-spacing = 4
button-margin = 8

elevation-focused = 3
elevation-unfocused = 1

animation-duration = 400
animation-curve = emphasized-decelerate
animation-close-duration = 200
animation-close-curve = emphasized-accelerate
animation-open-scale = 90
